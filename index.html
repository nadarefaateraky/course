<!DOCTYPE html>
<html>
<head>
    <title>My Form</title>
    <link rel="stylesheet" href="./styleFORM.css">
</head>

<body>

    <form>
        <h2>Registration Form</h2>

        <label>Name:</label>
        <input type="text">

        <label>Password:</label>
        <input type="password">

        <label>Age:</label>
        <input type="number">

        <label>Date:</label>
        <input type="date">

        <label>Time:</label>
        <input type="time">

        <button type="submit">Submit</button>
    </form>

</body>
</html>
